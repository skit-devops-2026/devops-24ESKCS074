
name: PetPal CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene check
        run: bash scripts/hygiene.sh

  build-and-test:
    runs-on: ubuntu-latest
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Build
        run: make build
