
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petpal-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petpal
  template:
    metadata:
      labels:
        app: petpal
    spec:
      containers:
        - name: petpal
          image: atulyatiwari2006/petpal:m6
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
