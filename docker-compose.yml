
services:
  petpal:
    build: .
    container_name: petpal-container
    ports:
      - "3000:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: petpal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: petpal-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
